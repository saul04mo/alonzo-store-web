# ═══════════════════════════════════════════════
# Alonzo Store — Netlify Configuration
# ═══════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ─── Next.js via @netlify/plugin-nextjs ─────────
[[plugins]]
  package = "@netlify/plugin-nextjs"


# ─── Security Headers ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─── Cache: static assets ───────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Dominio anterior → alonzove.com ────────────
# alonzocollection.com queda como alias en Netlify sólo para redirigir:
# 301 conserva el SEO acumulado y los links viejos (Instagram, WhatsApp).
[[redirects]]
  from = "https://alonzocollection.com/*"
  to = "https://alonzove.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alonzocollection.com/*"
  to = "https://alonzove.com/:splat"
  status = 301
  force = true
